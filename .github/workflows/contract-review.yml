name: Cross-module contract review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  contract-review:
    name: contract-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const contractFile = files.some(({ filename }) =>
              filename === 'src/shared/lib/apiClient.ts' ||
              /^src\/features\/[^/]+\/api\//.test(filename) ||
              /\/types\//.test(filename)
            );
            if (!contractFile) return;

            const body = context.payload.pull_request.body || '';
            const noChange = /- \[[xX]\] No frontend\/backend contract change/.test(body);
            const counterpart = /https:\/\/github\.com\/Digital-Pathshala\/DP-SMS-BACKEND\/pull\/\d+/.test(body);
            const reviewed = /- \[[xX]\] Contract change documented and counterpart PR linked below/.test(body);
            if (!noChange && !(counterpart && reviewed)) {
              core.setFailed('Contract-sensitive files changed. Check “No frontend/backend contract change”, or check the contract-change item and link the backend counterpart PR.');
            }
