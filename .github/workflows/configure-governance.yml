name: Configure repository governance

on:
  workflow_dispatch:

jobs:
  protect-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Apply main and staging branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          script: |
            for (const branch of ['main', 'staging']) {
              try {
                await github.rest.repos.getBranch({ ...context.repo, branch });
              } catch (error) {
                if (error.status === 404) { core.warning(`Skipping missing branch: ${branch}`); continue; }
                throw error;
              }
              await github.rest.repos.updateBranchProtection({
                ...context.repo,
                branch,
                required_status_checks: {
                  strict: true,
                  contexts: ['lint', 'type-check', 'tests', 'npm-audit', 'contract-review'],
                },
                enforce_admins: true,
                required_pull_request_reviews: {
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false,
                  required_approving_review_count: 1,
                  require_last_push_approval: true,
                },
                restrictions: null,
                required_conversation_resolution: true,
                required_linear_history: true,
                allow_force_pushes: false,
                allow_deletions: false,
              });
            }
